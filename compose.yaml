name: groovy-shift-system

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        depends_on:
            db:
                condition: service_healthy
        networks:
            - groovy

    web:
        image: nginx:1.29-alpine
        ports:
            - '${APP_PORT:-8082}:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - groovy

    node:
        build:
            context: .
            dockerfile: Dockerfile
            target: node
        image: groovy-shift-system-node
        working_dir: /var/www/html
        command: npm run dev -- --host 0.0.0.0
        environment:
            VITE_APP_ORIGIN: '${APP_URL:-http://localhost:8082}'
            VITE_HOST_PORT: '${VITE_PORT:-5173}'
        ports:
            - '${VITE_PORT:-5173}:5173'
        volumes:
            - .:/var/www/html
        depends_on:
            db:
                condition: service_healthy
        networks:
            - groovy

    db:
        image: mysql:8.4
        ports:
            - '${FORWARD_DB_PORT:-33060}:3306'
        environment:
            MYSQL_DATABASE: '${DB_DATABASE:-groovy_shift}'
            MYSQL_USER: '${DB_USERNAME:-groovy}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-groovy_password}'
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-root_password}'
            TZ: Asia/Tokyo
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - -h
                - 127.0.0.1
                - -u
                - root
                - '-p${DB_ROOT_PASSWORD:-root_password}'
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s
        networks:
            - groovy

volumes:
    mysql-data:

networks:
    groovy:
        driver: bridge
